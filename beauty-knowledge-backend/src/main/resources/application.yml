spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/**/*.xml

beauty:
  jwt:
    secret: ${BEAUTY_JWT_SECRET:please-change-in-env-32-chars-min}
    expire-in-seconds: 86400
  llm:
    provider: ollama

logging:
  level:
    com.beauty.knowledge: debug
