spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:beauty_knowledge}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:beauty}
    password: ${RABBIT_PASSWORD:}
    listener:
      simple:
        auto-startup: true
      direct:
        auto-startup: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

beauty:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:beauty}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: beauty-knowledge
  milvus:
    host: localhost
    port: 19530
  ai:
    python:
      base-url: http://localhost:8001
      timeout: 30000
  llm:
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:1.5b
      timeout-ms: 180000
      num-predict: 120
      temperature: 0.2
      num-ctx: 1024
      think: false
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-plus
      timeout-ms: 30000
  rag:
    bm25-topk: 2
    vector-topk: 2
    rrf-k: 60
    rerank-top: 2
    context-max-round: 1
    intent-timeout: 30000
  pipeline:
    max-retry: 3
    embed-batch-size: 32
    chunk-size: 400
    chunk-overlap: 80
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - http://localhost:4174
      - http://127.0.0.1:4174
      - http://localhost:8080
      - http://127.0.0.1:8080
  security:
    disable-default-seed-users: ${DISABLE_DEFAULT_SEED_USERS:true}
  db:
    auto-create-chat-tables: ${DB_AUTO_CREATE_CHAT_TABLES:false}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
