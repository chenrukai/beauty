spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:12345/beauty_knowledge?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: beauty
    password: beauty123
    listener:
      simple:
        auto-startup: true
      direct:
        auto-startup: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

beauty:
  minio:
    endpoint: http://localhost:9000
    access-key: beauty
    secret-key: beauty123456
    bucket: beauty-knowledge
  milvus:
    host: localhost
    port: 19530
  ai:
    python:
      base-url: http://localhost:8001
      timeout: 30000
  llm:
    provider: ollama
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:1.5b
      timeout-ms: 180000
      num-predict: 120
      temperature: 0.2
      num-ctx: 1024
      think: false
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-plus
      timeout-ms: 30000
  rag:
    bm25-topk: 2
    vector-topk: 2
    rrf-k: 60
    rerank-top: 2
    context-max-round: 1
    intent-timeout: 30000
  pipeline:
    max-retry: 3
    embed-batch-size: 32
    chunk-size: 400
    chunk-overlap: 80
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - http://localhost:4174
      - http://127.0.0.1:4174
      - http://localhost:8080
      - http://127.0.0.1:8080
