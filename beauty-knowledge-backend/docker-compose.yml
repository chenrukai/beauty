version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: beauty-mysql
    restart: unless-stopped
    command: --ngram_token_size=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beauty_knowledge}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - beauty-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - beauty-net

  redis:
    image: redis:7.0-alpine
    container_name: beauty-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - beauty-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - beauty-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: beauty-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-beauty}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - beauty-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - beauty-net

  minio:
    image: minio/minio:latest
    container_name: beauty-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-beauty}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - beauty-minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - beauty-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: beauty-etcd
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCDCTL_API: "3"
    volumes:
      - beauty-etcd-data:/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - beauty-net

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: beauty-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - beauty-milvus-data:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - beauty-net

  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: beauty-whisper-asr
    restart: unless-stopped
    profiles:
      - transcribe
    environment:
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_ENGINE: ${ASR_ENGINE:-openai_whisper}
    ports:
      - "${WHISPER_PORT:-9002}:9000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/docs" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - beauty-net

networks:
  beauty-net:
    driver: bridge

volumes:
  beauty-mysql-data:
  beauty-redis-data:
  beauty-rabbitmq-data:
  beauty-minio-data:
  beauty-etcd-data:
  beauty-milvus-data:
