name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend validate
        run: mvn -q -DskipTests validate
        working-directory: beauty-knowledge-backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: beauty-knowledge-frontend/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: beauty-knowledge-frontend

      - name: Frontend build
        run: npm run build
        working-directory: beauty-knowledge-frontend

